[package]
name = "ideaplanner-core"
description = "Board model shared by the Idea Planner desktop/mobile app and server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { version = "12", optional = true }

[features]
# `cargo test -p ideaplanner-core --features ts` regenerates web/src/lib/model.gen.ts
ts = ["dep:ts-rs"]
