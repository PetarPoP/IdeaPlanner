[package]
name = "ideaplanner-server"
description = "Serves the Idea Planner web app and stores shared boards in Postgres"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ideaplanner-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
dotenvy = "0.15"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
mail-parser = "0.11.9"
chrono.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
sha2 = "0.11.0"
getrandom = "0.4.3"
futures-util = "0.3.34"

[dev-dependencies]
tokio-tungstenite = "0.30.0"
tower = { version = "0.5", features = ["util"] }
