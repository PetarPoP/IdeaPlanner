[package]
name = "ideaplanner-server"
description = "Serves the Idea Planner web app and stores shared boards in Postgres"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ideaplanner-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
mail-parser = "0.11.9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
